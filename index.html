<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduSphere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M16 7 4 13l12 6 12-6zM9 17v5c0 2 3.5 4 7 4s7-2 7-4v-5l-7 3.5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--card:#fff;--line:#dbe4f5;--ink:#0f1b3d;--mute:#5b6b8c;--blue:#1d4ed8;--blue-d:#1e3a8a;--blue-l:#eff6ff;--bad:#b42318;--badl:#fdecea;--bb:#1d4ed8;--bbh:#1e3a8a}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .25s,color .25s}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.back{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--blue);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.back[hidden]{display:none}.back:hover{background:var(--blue-l);border-color:var(--blue);transform:translateX(-2px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;color:var(--blue);text-decoration:none}.brand b{color:var(--ink)}.logo{width:30px;height:30px}
.crumb{font-size:13px;color:var(--mute);flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.crumb a{color:var(--blue);text-decoration:none}.crumb a:hover{text-decoration:underline}.crumb i{font-style:normal;margin:0 4px}
.hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:40px 24px 64px}
h1{font-size:30px;line-height:1.2;color:var(--blue-d);margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:28px;max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:28px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(29,78,216,.14);transform:translateY(-2px)}
.card h2{font-size:22px;color:var(--blue);margin-bottom:6px}.card p,.card small{color:var(--mute);font-size:14px;line-height:1.5}
.card.cont{grid-column:1/-1;background:var(--blue-l)}
.btn{background:var(--bb);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--bbh);color:#fff}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--card);color:var(--blue);border:1.5px solid var(--line);padding:8px 14px;font-size:14px}.btn.ghost:hover{border-color:var(--blue);background:var(--blue-l)}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:var(--card)}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,141,255,.3)}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.form{max-width:420px;border:1.5px solid var(--line);border-radius:14px;padding:28px;background:var(--card)}
.pw{position:relative}.pw input{padding-right:64px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px}
.err{color:var(--bad);font-size:14px;margin-top:14px;min-height:20px}
.center{max-width:520px;margin:0 auto;text-align:center;padding-top:5vh}.center.wide{max-width:760px}.center .sub{margin-left:auto;margin-right:auto}.center .form{margin:0 auto;text-align:left}
.combo{text-align:left}.combo input{padding:14px 16px;font-size:16px}
#opts{list-style:none;padding:6px;margin:8px 0 0;border:1.5px solid var(--line);border-radius:12px;max-height:340px;overflow-y:auto;box-shadow:0 10px 28px rgba(29,78,216,.14);background:var(--card)}
#opts li{padding:11px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#opts li small{color:var(--mute);white-space:nowrap}#opts li:hover,#opts li.hi{background:var(--blue-l);color:var(--blue-d)}#opts li.none{cursor:default;color:var(--mute);justify-content:center}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}.bar input{max-width:300px}.bar select{width:auto}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--blue-l);border-radius:12px;padding:14px 20px;min-width:140px;flex:1}.stat b{display:block;font-size:26px;color:var(--blue-d);overflow-wrap:anywhere}.stat small{color:var(--mute)}.stat.bad b{color:var(--bad)}
.tw{background:var(--card);overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--blue-l);color:var(--blue-d);text-align:left;padding:11px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.empty{padding:40px;text-align:center;color:var(--mute)}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue-d);padding:2px 9px;border-radius:6px;font-size:12px}.tag.bad{background:var(--badl);color:var(--bad)}.mute{color:var(--mute)}
.pick tbody tr{cursor:pointer;transition:background .15s}.pick tbody tr:hover,.pick tbody tr:focus-visible{background:var(--blue-l);outline:none}.pick td:first-child{width:150px;color:var(--blue);font-weight:600}
.split{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
aside{position:sticky;top:84px;border:1.5px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}
.who{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-wrap:anywhere}.who small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.av{width:56px;height:56px;border-radius:50%;background:var(--bb);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;margin:0 auto 8px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{text-align:left;border:0;border-left:3px solid transparent;background:none;font:inherit;padding:11px 14px;border-radius:10px;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,padding-left .2s,border-color .2s}
.menu button:hover{background:var(--blue-l)}.menu button.on{background:var(--blue-l);color:var(--blue);font-weight:600;border-left-color:var(--blue);padding-left:22px}
h1#pt{margin-bottom:18px}h3{color:var(--blue-d);margin:8px 0 12px;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:22px}.kv>div{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0;overflow-wrap:anywhere;background:var(--card)}.kv>div.wide{grid-column:span 2}.kv small{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.big{background:var(--blue-l);border-radius:14px;padding:20px 24px;margin-bottom:20px}.big b{font-size:38px;color:var(--blue-d);display:block}.big small{color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(140px,260px) 1fr 76px;gap:14px;align-items:center;margin-bottom:14px}.row span{overflow-wrap:anywhere}
.track{height:10px;background:var(--blue-l);border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}.fill.warn{background:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.cc{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}.cc .row{grid-template-columns:1fr 70px;gap:6px 12px}.cc .row .track{grid-column:1/-1;order:3}
.dw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;position:relative;display:grid;place-items:center}.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}.donut span{position:relative;z-index:1;font-weight:700;font-size:22px;color:var(--blue-d)}
.lg{list-style:none;padding:0;font-size:13px;line-height:1.9}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.tgw{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}.tg{display:grid;grid-template-columns:64px repeat(6,minmax(120px,1fr));min-width:820px}
.th{background:var(--blue-l);color:var(--blue-d);font-weight:600;padding:10px;text-align:center;font-size:13px}.th.today{background:var(--bb);color:#fff}
.tl{padding:10px 8px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);text-align:right}.tc{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;min-height:62px}.tc.today{background:var(--blue-l)}
.slot{background:var(--bb);color:#fff;border-radius:8px;padding:7px 9px;font-size:12px;height:100%}.slot span{display:block;font-weight:600}.slot small{opacity:.85}
.sk{height:18px;border-radius:8px;margin-bottom:14px;background:linear-gradient(90deg,var(--blue-l) 25%,var(--line) 50%,var(--blue-l) 75%);background-size:200% 100%;animation:sh 1.2s infinite}.sk:first-child{height:34px;width:50%}
@keyframes sh{to{background-position:-200% 0}}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .3s both;max-width:90vw}.toast.bad{background:#b42318;color:#fff}.toast.ok{background:#1d4ed8;color:#fff}.toast.warn{background:#b45309;color:#fff}
.lc{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--card)}.lc p{margin:4px 0}.lc a{color:var(--blue);text-decoration:none}
.la{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.la input{width:190px;padding:9px 12px}.btn.ghost.bad{color:var(--bad)}.btn.ghost.bad:hover{border-color:var(--bad);background:var(--badl)}
.lvbox{border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:24px;background:var(--card)}.lvbox summary{cursor:pointer;font-size:16px;padding:2px 0}.lvl{max-height:380px;overflow-y:auto;margin-top:14px}
.dy{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-size:11px;font-style:normal;margin:2px}.dy.P{background:var(--blue-l);color:var(--blue-d)}.dy.A{background:var(--badl);color:var(--bad)}.dy.L{background:#fff4d6;color:#8a5a00}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chips[hidden]{display:none}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}.chip:hover{border-color:var(--blue)}.chip.on{background:var(--bb);border-color:var(--bb);color:#fff}
/* add student / faculty form */
.fform{max-width:900px;border:1.5px solid var(--line);border-radius:14px;padding:8px 28px 28px;background:var(--card)}
.fsec{margin:26px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}.fgrid .full{grid-column:1/-1}
.req{color:var(--bad)}.hint{font-size:12px;color:var(--mute);margin-top:4px}
.fact{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}.fact .btn.ghost{padding:10px 18px;font-size:inherit}
.addrow{margin-bottom:22px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(circle,rgba(29,78,216,.09) 1px,transparent 1.6px) 0 0/28px 28px}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:#bfdbfe;opacity:.55;top:-16vmax;left:-12vmax;animation:d1 42s ease-in-out infinite alternate}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:#dbeafe;opacity:.9;bottom:-14vmax;right:-10vmax;animation:d2 50s ease-in-out infinite alternate}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:#93c5fd;opacity:.3;top:38%;left:46%;animation:d3 58s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.12)}}@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(1.08)}}@keyframes d3{to{transform:translate(-20vmax,8vmax) scale(.9)}}
.still .bg i{animation-play-state:paused}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}.live i{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.go>*,.go .kv>div,.go tbody tr,.go .row,.go .stat,.go .cc{animation:rise .45s both;animation-delay:calc(var(--i,0)*45ms)}
#pa{display:none}
@media(max-width:800px){
 header{padding:10px 14px}.crumb{display:none}.hb{margin-left:auto}main{padding:28px 16px}h1{font-size:24px}
 .split{grid-template-columns:1fr;padding-bottom:76px}
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;border-width:1.5px 0 0;border-radius:14px 14px 0 0;padding:6px;z-index:6}.who{display:none}
 .menu{flex-direction:row}.menu button{flex:1;text-align:center;border-left:0;border-top:3px solid transparent;padding:10px 2px;font-size:12px}.menu button.on{border-top-color:var(--blue);padding-left:2px}
 .kv>div.wide{grid-column:auto}.rt table,.rt thead,.rt tbody,.rt tr,.rt td{display:block}.rt thead{display:none}.rt tr{padding:10px 14px;border-top:1px solid var(--line)}.rt td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:14px}.rt td::before{content:attr(data-l);color:var(--mute);font-size:12px}
 .row{grid-template-columns:1fr 70px}.row .track{grid-column:1/-1;order:3}#toasts{bottom:84px}.fform{padding:4px 16px 20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#ccc;--blue-l:#eef3ff;--blue:#1d4ed8;--blue-d:#1e3a8a}body>header,body>main,#toasts,.bg{display:none!important}#pa{display:block!important;padding:8px}#pa *{animation:none!important}#pa .la{display:none}#pa h1,#pa h2{margin-bottom:6px}#pa h3{margin-top:18px}.kv>div,.tw,.cc{break-inside:avoid}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
<button class="back" id="bk" onclick="history.back()" aria-label="Go back" title="Back (Esc)" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<a class="brand" href="#" onclick="home();return false"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1d4ed8"/><path d="M16 7 4 13l12 6 12-6zM9 17v5c0 2 3.5 4 7 4s7-2 7-4v-5l-7 3.5z" fill="#fff"/></svg>Edu<b>Sphere</b></a>
<div class="crumb" id="crumb" role="navigation" aria-label="Breadcrumb"></div>
<div class="hb"><span class="live" id="live" title="Auto-refreshes every 20 seconds"><i></i>Live</span><span id="hbtn"></span></div>
</header>
<main id="app"></main>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://dfyvglvfqpnbseqlqjcz.supabase.co',KEY='sb_publishable_tIM7euu0F69QnA9KvG2FOA_ELjGxFOt';
const S={type:null,inst:null,sess:null,list:[],data:null,d:null,kind:null,tab:0,q:'',sort:'id',view:'home',dept:'All',cls:'all',secs:[],opts:null,draft:{},t0:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
/* page state is kept in sessionStorage so a refresh returns to the same screen (cleared when the tab is closed) */
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const SAVED=ss.get('edu_state');
function save(){
  if(S.view==='home'||!S.type){ss.del('edu_state');return}
  ss.set('edu_state',JSON.stringify({v:S.view,type:S.type,iid:S.inst&&S.inst.institution_id,sess:S.sess,t0:S.t0,kind:S.kind,dept:S.dept,cls:S.cls,q:S.q,sort:S.sort,tab:S.tab,did:S.view==='detail'&&S.d?S.d.profile.id:null,draft:S.draft}));
}
async function rpc(fn,args){
  const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(j&&j.message||'Request failed');
  return j;
}
/* toast, skeleton */
function toast(m,c='',ms=3500){const t=document.createElement('div');t.className='toast '+c;t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),ms)}
const skel=(n=5)=>'<div>'+'<div class="sk"></div>'.repeat(n)+'</div>';
/* navigation + history */
let popping=false,T1,T2;
function push(v){S.view=v;$('bk').hidden=v==='home';if(!popping)history.pushState({v},'');save()}
function route(v){
  const ok={list:S.type&&S.list.length,login:S.inst,roles:S.sess,people:S.sess&&S.data,sections:S.sess&&S.data,detail:S.sess&&S.d,addform:S.sess&&S.data&&S.opts};
  if(v==='home'||!ok[v])return home();
  ({list:showList,login:()=>login(S.inst.institution_id),roles,sections:drawSections,people:drawList,detail:drawDetail,addform:drawForm})[v]();
}
window.addEventListener('popstate',e=>{popping=true;route(e.state&&e.state.v||'home');popping=false});
function head(c,btn){$('crumb').innerHTML=c.map(([l,f])=>f?`<a href="#" onclick="${f};return false">${esc(l)}</a>`:`<span>${esc(l)}</span>`).join('<i>&rsaquo;</i>');$('hbtn').innerHTML=btn||''}
const OUT='<button class="btn ghost" onclick="signOut()">Sign out</button>';
function clearTimers(){clearTimeout(T1);clearTimeout(T2)}
function startTimers(){
  clearTimers();const left=8*3600000-(Date.now()-(S.t0||Date.now()));
  if(left<=0)return signOut('Session expired. Please sign in again.');
  if(left>5*60000)T1=setTimeout(()=>toast('Your session expires in 5 minutes. Sign in again to keep working.','warn',9000),left-5*60000);
  T2=setTimeout(()=>signOut('Session expired. Please sign in again.'),left);
}
function signOut(m){const was=S.sess;home();toast(m||(was?'Signed out':'Welcome'),m?'warn':'')}
/* home */
function home(){
  clearTimers();S.type=S.inst=S.sess=S.data=S.d=S.opts=null;S.draft={};push('home');head([['Home']]);
  let last=null;try{last=JSON.parse(ls.get('edu_last'))}catch(e){}
  $('app').innerHTML=`<div class="center wide"><h1>Welcome to EduSphere</h1><p class="sub">Manage your school or college in one place. Start by choosing your institution type.</p></div>
  <div class="cards" style="max-width:760px;margin:0 auto">${last?`<button class="card cont" onclick="resume()"><small>Continue where you left off</small><h2>${esc(last.name)}</h2><p>${esc(last.type)} &middot; ${esc(last.city)}</p></button>`:''}
  <button class="card" onclick="pick('School')"><h2>School</h2><p>Secondary, Science and Commerce sections.</p></button>
  <button class="card" onclick="pick('College')"><h2>College</h2><p>Engineering, Medical, Management, Pharmacy, Law and more.</p></button></div>`;
}
async function resume(){
  let l;try{l=JSON.parse(ls.get('edu_last'))}catch(e){return home()}
  S.type=l.type;$('app').innerHTML=skel(4);
  try{S.list=await rpc('list_institutions',{p_type:l.type});S.list.some(i=>i.institution_id===l.id)?login(l.id):showList()}
  catch(e){toast(e.message,'bad');home()}
}
async function pick(t){

function printAll(){
  const p=S.d.profile,pa=document.createElement('div');pa.id='pa';
  pa.innerHTML=`<h1>${esc(S.sess.name)}</h1><h2>${esc(p.name)} (ID ${p.id})</h2>`+TABS[S.kind].map((t,i)=>i?`<h3>${t}</h3>`+V[S.kind][i](S.d):'').join('');
  document.body.appendChild(pa);pa.querySelectorAll('.fill').forEach(e=>e.style.width=e.dataset.w+'%');
  window.print();setTimeout(()=>pa.remove(),500);
}
/* add new student / faculty */
const QUAL=['B.Ed','B.Sc, B.Ed','M.A.','M.A., B.Ed','M.Com','M.Sc','M.Sc, B.Ed','M.Ed','M.Phil','M.E.','M.Tech','MBA','M.Pharm','Pharm.D','MD','MS','MDS','CA','LLM','LLB, LLM','Ph.D.'];
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const fv=n=>esc(S.draft[n]??'');
const lab=(n,l,o)=>`<label for="f_${n}">${l}${o.r?' <span class="req">*</span>':''}</label>`;
const inp=(n,l,o={})=>`<div>${lab(n,l,o)}<input id="f_${n}" name="${n}" type="${o.t||'text'}" value="${fv(n)}" ${o.r?'required':''} ${o.a||''}>${o.h?`<div class="hint">${o.h}</div>`:''}</div>`;
const ta=(n,l,o={})=>`<div class="full">${lab(n,l,o)}<textarea id="f_${n}" name="${n}" rows="2" ${o.r?'required':''}>${fv(n)}</textarea></div>`;
const optH=(n,o,p)=>`<option value="">${p}</option>`+o.map(([v,t])=>`<option value="${esc(v)}" ${String(S.draft[n]??'')===String(v)?'selected':''}>${esc(t)}</option>`).join('');
const sel=(n,l,o,p,r)=>`<div>${lab(n,l,{r})}<select id="f_${n}" name="${n}" ${r?'required':''}>${optH(n,o,p)}</select></div>`;
const courseOpts=()=>S.opts.courses.filter(c=>c.unit_id===+S.draft.unit_id).map(c=>[c.id,c.name]);
const semOpts=()=>{const u=S.opts.units.find(x=>x.id===+S.draft.unit_id);return S.opts.semesters.filter(s=>s.course_id===+S.draft.course_id).map(s=>[s.id,clsL(u?u.name:'',s.num)+' ('+s.year+')'])};
async function openForm(restoring){
  const f=S.kind==='faculty';$('app').innerHTML=skel(8);
  try{S.opts=await rpc('form_options',{p_token:S.sess.token})}
  catch(e){if(restoring)throw e;if(/unauthorized/i.test(e.message))return signOut('Session ended. Please sign in again.');toast(e.message,'bad');return S.view==='people'?drawList():drawSections()}
  if(!restoring){
    S.draft={[f?'joining_date':'admission_date']:ymd(new Date())};
    if(!f)S.draft.relationship='Father';
    const u=S.view==='people'&&S.dept!=='All'?S.opts.units.find(x=>x.name===S.dept):null;
    if(u){S.draft.unit_id=String(u.id);const c=courseOpts();if(c.length===1)S.draft.course_id=String(c[0][0])}
  }
  drawForm();
}
function drawForm(){
  const f=S.kind==='faculty',O=S.opts,sch=S.sess.type==='School',num='inputmode="numeric"';
  push('addform');
  head([['Home','home()'],[S.type+'s','showList()'],[S.sess.name,'roles()'],[f?'Faculty':'Students','drawSections()'],[f?'Add faculty':'Add student']],'<button class="btn ghost" onclick="roles()">Switch dashboard</button> '+OUT);
  const U=O.units.map(u=>[u.id,u.name]),G=['Male','Female','Other'].map(x=>[x,x]),unit=sel('unit_id',sch?'Section':'Department',U,'Select '+(sch?'section':'department'),1);
  const aad=inp('aadhaar_no','Aadhaar number',{r:1,a:`${num} maxlength="12" pattern="[0-9]{12}" title="12 digits"`}),mob=inp('mobile','Mobile number',{r:1,t:'tel',a:`${num} maxlength="10" pattern="[0-9]{10}" title="10 digits"`});
  let b;
  if(f){
    const m=new Date();m.setFullYear(m.getFullYear()-18);
    b=`<h3 class="fsec">Personal details</h3><div class="fgrid">${inp('first_name','First name',{r:1,a:'autocomplete="off"'})}${inp('last_name','Last name',{r:1,a:'autocomplete="off"'})}${sel('gender','Gender',G,'Select gender',1)}${inp('dob','Date of birth',{r:1,t:'date',a:`max="${ymd(m)}"`,h:'Must be at least 18 years old'})}${aad}${inp('pan_no','PAN number',{a:'maxlength="10" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]" title="Example: ABCDE1234F" style="text-transform:uppercase" autocomplete="off"',h:'Optional. Example: ABCDE1234F'})}${mob}${inp('email','Email',{r:1,t:'email'})}${ta('address','Address')}</div>
    <h3 class="fsec">Job details</h3><div class="fgrid">${unit}${inp('qualification','Qualification',{a:'list="ql" autocomplete="off"',h:'Pick a suggestion or type your own'})}${inp('experience','Experience (years)',{r:1,t:'number',a:'min="0" max="60" step="1"'})}${inp('joining_date','Joining date',{r:1,t:'date'})}${inp('salary','Salary (\u20B9)',{r:1,t:'number',a:'min="1" step="0.01"'})}</div><datalist id="ql">${QUAL.map(q=>`<option value="${esc(q)}">`).join('')}</datalist>`;
  }else{
    b=`<h3 class="fsec">Personal details</h3><div class="fgrid">${inp('first_name','First name',{r:1,a:'autocomplete="off"'})}${inp('last_name','Last name',{r:1,a:'autocomplete="off"'})}${inp('dob','Date of birth',{r:1,t:'date',a:`max="${ymd(new Date())}"`})}${sel('gender','Gender',G,'Select gender',1)}${sel('blood_group','Blood group',['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(x=>[x,x]),'Select (optional)')}${aad}${mob}${inp('email','Email',{t:'email',h:'Optional'})}${ta('address','Address',{r:1})}</div>
    <h3 class="fsec">Admission details</h3><div class="fgrid">${unit}${sel('course_id','Course',S.draft.unit_id?courseOpts():[],'Select course',1)}${sel('semester_id',sch?'Class':'Semester',S.draft.course_id?semOpts():[],'Select '+(sch?'class':'semester'),1)}${inp('admission_date','Admission date',{r:1,t:'date'})}</div>
    <h3 class="fsec">Parent / guardian details</h3><div class="fgrid">${inp('father_name',"Father's name",{r:1})}${inp('mother_name',"Mother's name")}${inp('guardian_name','Guardian name',{h:'Optional, if different from parents'})}${sel('relationship','Contact person is',['Father','Mother','Guardian'].map(x=>[x,x]),'Select')}${inp('p_mobile','Parent mobile number',{r:1,t:'tel',a:`${num} maxlength="10" pattern="[0-9]{10}" title="10 digits"`})}${inp('p_email','Parent email',{t:'email'})}${inp('occupation','Occupation')}${ta('p_address','Parent address (if different)')}</div>`;
  }
  $('app').innerHTML=`<h1>${f?'Add new faculty member':'Add new student'}</h1><p class="sub">Fill in the details and press Finish to save. Fields marked <span class="req">*</span> are required. ${f?'The faculty code':'The enrollment and roll numbers'} will be created automatically.</p>
  <form class="fform" id="nf" onsubmit="saveForm(event)" oninput="draftSave(event)" onchange="draftSave(event)">${b}<div class="err" id="ferr" role="alert"></div><div class="fact"><button type="button" class="btn ghost" onclick="history.back()">Cancel</button><button class="btn" id="fb">Finish</button></div></form>`;
  if(!S.draft.first_name)$('f_first_name').focus();
}
function reSel(n,o,p){const e=$('f_'+n);if(e)e.innerHTML=optH(n,o,p)}
function draftSave(e){
  const t=e.target;if(!t.name)return;S.draft[t.name]=t.value;
  if(S.kind==='students'){
    const sch=S.sess.type==='School';
    if(t.name==='unit_id'){const c=courseOpts();S.draft.course_id=c.length===1?String(c[0][0]):'';reSel('course_id',c,'Select course')}
    if(t.name==='unit_id'||t.name==='course_id'){S.draft.semester_id='';reSel('semester_id',S.draft.course_id?semOpts():[],'Select '+(sch?'class':'semester'))}
  }
  save();
}
async function saveForm(e){
  e.preventDefault();const f=S.kind==='faculty',b=$('fb'),er=$('ferr');b.disabled=true;b.textContent='Saving...';er.textContent='';
  const d={};new FormData($('nf')).forEach((v,k)=>d[k]=typeof v==='string'?v.trim():v);
  let r;
  try{r=await rpc(f?'add_faculty':'add_student',{p_token:S.sess.token,p:d})}
  catch(x){
    if(/unauthorized/i.test(x.message))return signOut('Session ended. Please sign in again.');
    er.textContent=x.message;b.disabled=false;b.textContent='Finish';er.scrollIntoView({block:'center',behavior:'smooth'});return;
  }
  toast(f?'Faculty member added. Code: '+r.code:'Student added. Enrollment no: '+r.enrollment_no+', roll no: '+r.roll_no,'ok',6000);
  S.draft={};
  try{const a={p_token:S.sess.token};[S.data,S.leaves]=await Promise.all([rpc('dash_'+S.kind,a),f?rpc('leave_requests',a):[]]);S.secs=[...new Set(S.data.rows.map(x=>x.dept))].sort()}catch(x){}
  popping=true;await openItem(r.id);popping=false;history.replaceState({v:S.view},'');
}
/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const typing=['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName);
  if(e.key==='Escape'){if(typing)e.target.blur();else if(S.view!=='home')history.back();return}
  if(typing)return;
  if(e.key==='/'){const s=$('s');if(s){e.preventDefault();s.focus()}}
  else if(e.key==='?')toast('Shortcuts: / search, Esc back, 1-6 switch section, p print','',6000);
  else if(e.key==='p'&&S.view==='detail')printAll();
  else if(S.view==='detail'&&/^[1-9]$/.test(e.key)&&+e.key<=TABS[S.kind].length)setTab(+e.key-1);
});
/* live sync with the database */
let busy=false;const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
async function refresh(){
  if(document.hidden||busy)return;busy=true;
  const ae=document.activeElement,typing=!!ae&&['INPUT','SELECT'].includes(ae.tagName);
  try{
    if(S.view==='list'){const l=await rpc('list_institutions',{p_type:S.type});if(!same(l,S.list)){S.list=l;fill($('s').value)}}
    else if(S.sess&&['sections','people'].includes(S.view)){
      const a={p_token:S.sess.token},[d,l]=await Promise.all([rpc('dash_'+S.kind,a),S.kind==='faculty'?rpc('leave_requests',a):[]]);
      if((!same(d,S.data)||!same(l,S.leaves))&&!(typing&&S.view==='sections')){
        S.data=d;S.leaves=l;S.secs=[...new Set(d.rows.map(r=>r.dept))].sort();popping=true;
        if(S.view==='sections'||(S.dept!=='All'&&!S.secs.includes(S.dept)))drawSections();else{renderChips();renderRows()}
        popping=false;toast('Updated from the database')
      }
    }else if(S.sess&&S.view==='detail'&&!typing){
      const f=S.kind==='faculty',a={p_token:S.sess.token,p_id:S.d.profile.id},[d,x]=await Promise.all([rpc(f?'faculty_detail':'student_detail',a),f?rpc('faculty_extra',a):null]),n=x?Object.assign(d,x):d;
      if(!same(n,S.d)){S.d=n;setTab(S.tab)}
    }
    $('live').title='Last checked '+new Date().toLocaleTimeString();
  }catch(e){
    popping=false;
    if(S.view==='detail'&&/not found/i.test(e.message)){toast('This record was removed from the database','warn');S.d=null;await dash(S.kind)}
    else if(/unauthorized/i.test(e.message))signOut('Session ended. Please sign in again.');
  }finally{busy=false}
}
setInterval(refresh,20000);
let rt;try{if(window.supabase)supabase.createClient(URL_,KEY).channel('edusphere-changes').on('broadcast',{event:'change'},()=>{clearTimeout(rt);rt=setTimeout(refresh,400)}).subscribe(s=>{$('live').title=s==='SUBSCRIBED'?'Live: updates appear instantly':'Auto-refreshes every 20 seconds'})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('still',document.hidden));
/* after a refresh, return to the same screen the person was on */
async function restore(raw){
  let st=null;try{st=JSON.parse(raw)}catch(e){}
  const bail=m=>{popping=true;home();popping=false;history.replaceState({v:'home'},'');if(m)toast(m,'warn')};
  if(!st||!st.type)return bail();
  $('app').innerHTML=skel(6);popping=true;
  try{
    S.type=st.type;S.list=await rpc('list_institutions',{p_type:st.type});
    S.inst=S.list.find(i=>i.institution_id===st.iid)||null;
    if(st.v==='list')showList();
    else if(st.v==='login'){S.inst?login(st.iid):showList()}
    else{
      if(!st.sess||!S.inst)throw new Error('unauthorized');
      S.sess=st.sess;S.t0=st.t0;startTimers();
      S.kind=st.kind;S.dept=st.dept||'All';S.cls=st.cls||'all';S.q=st.q||'';S.sort=st.sort||'id';S.draft=st.draft||{};
      if(st.v==='roles')roles();
      else if(!['faculty','students'].includes(S.kind))roles();
      else{
        const a={p_token:S.sess.token};
        [S.data,S.leaves]=await Promise.all([rpc('dash_'+S.kind,a),S.kind==='faculty'?rpc('leave_requests',a):[]]);
        S.secs=[...new Set(S.data.rows.map(r=>r.dept))].sort();
        if(S.dept!=='All'&&!S.secs.includes(S.dept))S.dept='All';
        if(st.v==='people')drawList();
        else if(st.v==='addform')await openForm(true);
        else if(st.v==='detail'&&st.did)await openItem(st.did,st.tab||0);
        else drawSections();
      }
    }
  }catch(e){popping=false;return bail(/unauthorized/i.test(e.message)?'Session expired. Please sign in again.':'')}
  popping=false;history.replaceState({v:S.view},'');
}
if(SAVED)restore(SAVED);
else{popping=true;home();popping=false;history.replaceState({v:'home'},'')}
</script>
